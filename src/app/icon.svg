<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="#0B1120"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gjGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Phone/Bot soundwaves symbol -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Building / Space Hexagon -->
    <path d="M-90,-50 L0,-105 L90,-50 L90,60 L0,115 L-90,60 Z" fill="none" stroke="url(#gjGrad)" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Inner Call Center / AI Bot Waves -->
    <circle cx="0" cy="5" r="32" fill="url(#gjGrad)"/>
    <path d="M-45,-25 C-45,-25 -15,-60 0,-60 C15,-60 45,-25 45,-25" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M-65,-45 C-65,-45 -25,-90 0,-90 C25,-90 65,-45 65,-45" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Letter G & J Monogram -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="4">GJ SPACES</text>
</svg>
